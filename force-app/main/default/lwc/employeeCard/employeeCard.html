<template>
    <lightning-card title="Enter Student Details">

        <div class="slds-m-around_medium">
            <lightning-input label="Student Name" name="studentName" onchange={handlerInput}></lightning-input>
            <lightning-input label="Course" name="course" onchange={handlerInput}></lightning-input>
            <lightning-input label="College" name="college" onchange={handlerInput}></lightning-input>
            <lightning-button label="Show Student" onclick={handlerShow}></lightning-button>

            <template if:true={showStudent}>
                <div class="slds-p-around_medium">
                    <p><strong>Student :</strong>{studentName}</p>
                    <p><strong>Course :</strong>{course}</p>
                    <p><strong>College :</strong>{college}</p>
                </div>

            </template>
            <template if:false={errorMessage}>
                <p><strong>{errorMessage}</strong></p>
            </template>
        </div>
    </lightning-card>
</template>
