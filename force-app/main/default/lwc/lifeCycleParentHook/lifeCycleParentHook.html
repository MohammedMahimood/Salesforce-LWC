<template>
    <lightning-card title="Parent Life Cycle Hooks">
        <div class="slds-m-around_medium">
            <!-- <input type="text" onkeyup={handlerChange} />
            {name} -->
            <template if:true={isVisible}>
                <lightning-button variant="brand" label="Remove Child" title="Remove Child" onclick={handlerCheck}
                   class="slds-m-around_medium">

                </lightning-button>
            </template>
            <template if:false={isVisible}>
                <lightning-button variant="brand" label="Show Child" title="Show Child" onclick={handlerCheck}
                    class="slds-m-around_medium">
                </lightning-button>
            </template>
            <template if:true={isVisible}>
          
                <c-life-cycle-child-hook></c-life-cycle-child-hook>
            </template>
        </div>
    </lightning-card>
</template>
