<template>

    <lightning-card title="P-Child employee Handson L7">

        <div class="slds-m-around_medium">


            <template if:true={isLoading}>
                <p>Loading...</p>
            </template>
            <lightning-button label="Refresh Accounts" onclick={handlerRefresh}> </lightning-button>


            <template if:true={accList}>
                <template for:each={accList} for:item="acc">

                    <div key={acc.Id}>

                        <p>
                            <strong>Account Name :</strong>
                            {acc.Name}
                        </p>

                        <p>
                            <strong>Account Industry :</strong>
                            {acc.Industry}
                        </p>

                        <p>
                            <strong>Account Phone :</strong>
                            {acc.Phone}
                        </p>

                    </div>

                </template>
            </template>


            <template if:true={showNoRecords}>
                <p>No Accounts Found.</p>
            </template>


            <template if:true={error}>
                <p>Error loading Accounts.</p>
            </template>

        </div>

    </lightning-card>

</template>
