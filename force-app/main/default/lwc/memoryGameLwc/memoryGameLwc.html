 <template>
    <div class="container">
        <lightning-card title="Memory Game">
            <div class="slds-m-around_medium">
                <section class="score-panel">
                    <span class="moves">{moves}</span> Move(s)
                    <div class="timer">{totalTime}</div>
                    <div class="restart" onclick={shuffle}>
                        <i class="fa-solid fa-repeat" aria-hidden="true"></i>
                    </div>
                </section>
                <section class="game-panel">
                    <ul class="deck deck-card grid-container">
                        <template for:each={cards} for:item="card">
                            <li class={card.listCard} type={card.type} key={card.id} onclick={displayCard}>
                                <i class={card.icon}></i>
                            </li>
                        </template>
                    </ul>
                </section>

            </div>
        </lightning-card>
    </div>
</template>
