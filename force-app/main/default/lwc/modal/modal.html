<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_small">
  <div class="slds-modal__container">
    <button class="slds-button slds-button_icon slds-modal__close">
     <lightning-icon onclick={closeModalHandler} icon-name="utility:close"  alternative-text="close" size="small"></lightning-icon>
     
    </button>
    <div class="slds-modal__header">
      <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
        <slot name="title"></slot>
      </h1>
    </div>
    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
      <slot name="content"></slot>
    </div>
    <div class="slds-modal__footer slds-hide">
    <slot
        class="footerSlot"
        name="footer"
        onslotchange={handleFooterSlotChange}>
    </slot>
</div>
  </div>
</section>
<div class="slds-backdrop slds-backdrop_open" role="presentation" ></div>
</template>
