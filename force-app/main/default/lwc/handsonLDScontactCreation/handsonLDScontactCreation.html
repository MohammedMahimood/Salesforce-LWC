<template>

    <lightning-card title="Handson Lightning Data Service(LDS)">
        <div class="slds-m-around_medium">
            <lightning-record-edit-form object-api-name="Contact" record-id={recordId} onsubmit={handlerSubmit}
                onsuccess={handlerSuccess} onerror={handlerError}>
                <lightning-input-field field-name="FirstName"></lightning-input-field>
                <lightning-input-field field-name="LastName"></lightning-input-field>
                <lightning-input-field field-name="Email"></lightning-input-field>
                <lightning-input-field field-name="Phone"></lightning-input-field>
                <lightning-button label="Update" type="submit"></lightning-button>
            </lightning-record-edit-form>

        </div>
    </lightning-card>

</template>
