<template>
  <lightning-card title="Render Multiple Templates" icon-name="custom:custom14">
    <div class="slds-m-around_medium">
      <h2 class="slds-text-heading_small slds-m-bottom_medium" style="color: rgba(136, 6, 3, 0.963);"> Choose Your Form to Fillup </h2>
      <lightning-button variant="destructive" label="Signup" value="Signup" class="slds-m-left_x-small"
        onclick={handlerClick}> </lightning-button>
      <lightning-button variant="success" label="Signin" value="Signin" class="slds-m-left_x-small"
        onclick={handlerClick}> </lightning-button>
    </div>
  </lightning-card>
</template>
