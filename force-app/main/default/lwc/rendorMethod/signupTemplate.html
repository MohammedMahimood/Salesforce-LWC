<template>
    <lightning-card title=" Sign Up Template">
        <div class="slds-m-around_medium">
            <h2 class="slds-text-heading_large slds-m-around_medium"> SignUp Form</h2>
            <lightning-input type="text" label="First Name"></lightning-input>
            <lightning-input type="text" label="Last Name"></lightning-input>
            <lightning-input type="phone" label="Phone Number"></lightning-input>
            <lightning-input type="email" label="Email address"></lightning-input>
            <lightning-input type="password" label="Password"></lightning-input>
            <lightning-button variant="destructive-text" label="Back" value="Back" class="slds-m-left_x-small"
                onclick={handlerClick}>
            </lightning-button>
            <lightning-button variant="success" label="Signup" value="Signup" class="slds-m-left_x-small"
                onclick={submitHandler}> </lightning-button>
        </div>
    </lightning-card>
</template>
