<template>
    <lightning-card title="Calculate Price Handson L2">
        <div class="slds-m-around_medium">
            <lightning-input label="Product Name" name="productName" onchange={handlerOnChange}></lightning-input>
            <lightning-input label="Price" name="price" onchange={handlerOnChange}></lightning-input>
            <lightning-input label="Quatity" name="quantity" onchange={handlerOnChange}></lightning-input>
            <lightning-button label="Calculate Total" onclick={handlerCalc}></lightning-button>

            <template if:true={showCost}>
                <p><strong>Product: </strong>{productName}</p>
                <p><strong>Price: </strong>{price}</p>
                <p><strong>Quantity: </strong>{quantity}</p>
                <p><strong>Total: </strong>{totalCost}</p>
            </template>
            <template if:true={errorMessageEmpty}>
                <p><strong>{errorMessageEmpty}</strong></p>
            </template>
            <template if:true={errorMessage}>
                <p><strong>{errorMessage}</strong></p>
            </template>
        </div>

    </lightning-card>
</template>
