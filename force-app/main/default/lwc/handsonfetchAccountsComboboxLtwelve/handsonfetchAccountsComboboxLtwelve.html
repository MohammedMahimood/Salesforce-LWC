<template>
    <lightning-card title="P-Child employee Handson L7">

        <div class="slds-m-around_medium">
            <!-- <lightning-combobox label="Account Type" value={selectedType} options={options}
                onchange={handlerChange}></lightning-combobox> -->
            <lightning-input label="Search With Account Name" type="search" onchange={handlerChange}></lightning-input>
            <lightning-button label="Search" onclick={handlerClick}></lightning-button>
            <template if:true={isLoading}>
                <p>Loading....</p>
            </template>
            <template if:true={isEmpty}>
                <p>{empty}</p>
            </template>
            <template if:true={noRec}>
                <p>{noRec}</p>
            </template>
            <template if:false={dontRunApex}>
                <template for:each={accounts} for:item="acc">
                    <div key={acc.Id}>
                        <p><strong>Account Name :</strong>{acc.Name}</p>
                        <p><strong>Account Industry :</strong>{acc.Industry}</p>


                    </div>

                </template>
            </template>
            <template if:true={error}>
                <p>Error loading Accounts : {error}</p>
            </template>
        </div>

    </lightning-card>
</template>
