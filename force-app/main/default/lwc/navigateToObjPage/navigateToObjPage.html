<template>
    <lightning-card title="Navigation to New Record">
        <lightning-button variant="brand" label="New Record" onclick={navigateToRecordPage}></lightning-button>
    </lightning-card>

    <lightning-card title="Navigation to New Record with default values">
        <lightning-button variant="brand" label="New Recordwith default values"
            onclick={recDefaultValues}></lightning-button>
    </lightning-card>

    <lightning-card title="Navigation to List View">
        <lightning-button variant="brand" label="Navigate to ListView"
            onclick={navigateToListView}></lightning-button>
    </lightning-card>

    <lightning-card title="Navigation to Files">
        <lightning-button variant="brand" label="Navigate to Files"
            onclick={navigateToFiles}></lightning-button>
    </lightning-card>
</template>
