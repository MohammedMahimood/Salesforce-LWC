<template>
    <lightning-card title="Calculate Price Handson L4">
        <div class="slds-m-around_medium">
            <lightning-input label="Employee Name" name="employeeName" onchange={handlerOnChange}></lightning-input>
            <lightning-input label="Basic Salary" name="basicSalary" onchange={handlerOnChange}></lightning-input>
            <lightning-combobox name="performance" label="Performance" value={selectedValue}
                placeholder="Select performance" options={options} onchange={handleComboboxChange}></lightning-combobox>
            <lightning-button label="Calculate Bonus" onclick={handlerCalc}></lightning-button>

            <template if:true={showDetails}>
                <div class="slds-m-around_medium">
                    <p><strong>Employee Name: </strong>{employeeName}</p>
                    <p><strong>Basic Salary: </strong>{basicSalary}</p>
                    <p><strong>Performance: </strong>{selectedValue}</p>
                    <p><strong>Bonus Percentage: </strong>{percentValue}%</p>
                    <p><strong>Bonus Amount: </strong>{calcValue}</p>
                    <p><strong>Total Salary: </strong>{totalAmount}</p>
                </div>
            </template>
            <template if:true={errorMessage}>
                <p><strong>{errorMessage}</strong></p>
            </template>
            <template if:true={errorMessageEmpty}>
                <p><strong>{errorMessageEmpty}</strong></p>
            </template>

        </div>

    </lightning-card>

</template>
