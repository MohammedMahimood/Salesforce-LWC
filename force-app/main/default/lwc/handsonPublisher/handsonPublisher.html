<template>

    <lightning-card title="Handson PUBLISHER - Lightning Message Service">

        <div class="slds-m-around_medium">

            <!-- Display Account datatable -->
            <lightning-datatable key-field="Id" data={accounts} columns={columns} selected-rows={selectedRows}
                onrowselection={handlerRowSelection}>
            </lightning-datatable>

        </div>

    </lightning-card>

</template>
