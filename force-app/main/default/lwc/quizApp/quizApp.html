    <lightning-card title="Quiz App">
        <div class="slds-m-around_medium">
            <template if:true={isSubmitted}>
                <div class={isScoredFull}>You have Scored {correctAnswers} from the {quizQuestions.length}</div>
            </template>

            <form>
                <template for:each={quizQuestions} for:item="quiz">
                    <div key={quiz.id} class="slds-m-bottom_medium">
                        <div><strong> {quiz.id} - {quiz.question}</strong></div>
                        <div class="slds-grid slds-p-bottom_medium">
                            <div class="slds-col">
                                <input type="radio" name={quiz.id} value="a" onchange={handlerChange} />
                                {quiz.answers.a}
                            </div>
                            <div class="slds-col">
                                <input type="radio" name={quiz.id} value="b" onchange={handlerChange} />
                                {quiz.answers.b}
                            </div>
                            <div class="slds-col">
                                <input type="radio" name={quiz.id} value="c" onchange={handlerChange} />
                                {quiz.answers.c}
                            </div>
                            <div class="slds-col">
                                <input type="radio" name={quiz.id} value="d" onchange={handlerChange} />
                                {quiz.answers.d}
                            </div>
                        </div>
                    </div>
                </template>
                <lightning-button variant="Brand" type="submit" label="Submit" disabled={notAllSelected}
                    onclick={submitAnswers} title="Submit Quiz" class="slds-m-around_small">
                </lightning-button>
                <lightning-button variant="Brand" type="reset" label="Reset" onclick={resetAnswers} title="Reset Quiz"
                    class="slds-m-around_small">
                </lightning-button>
            </form>
        </div>
    </lightning-card>
</template>
