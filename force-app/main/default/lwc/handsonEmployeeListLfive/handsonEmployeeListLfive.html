<template>

    <lightning-card title="Search employee Handson L6">

        <div class="slds-m-around_medium">

            <lightning-input name="searchKey" label="Search for Employee" type="search" value={searchKey}
                onchange={handlerChange}></lightning-input>

            <div class="slds-m-around_medium">

                <template if:true={showDetails}>

                    <template for:each={filteredAccounts} for:item="fil">

                        <div key={fil.id}>

                            <p><strong>Name: </strong>{fil.name}</p>
                            <p><strong>Department: </strong>{fil.department}</p>
                            <p><strong>Salary: </strong>{fil.salary}</p>

                        </div>

                    </template>

                    <!-- 🔴 CHANGED: Cannot use filemp.length directly in HTML -->
                    <template if:true={noEmployee}>

                        <p>Employee not found. Please provide the correct employee name.</p>

                    </template>

                </template>

            </div>

        </div>

    </lightning-card>

</template>
