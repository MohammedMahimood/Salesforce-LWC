<template>
    <!-- Example on the premitive data types -->
    <c-p2c-alert-component card-heading='Hello this is a String passing from parent' number=989 is-valid=true
        message='Hi from this side'>
    </c-p2c-alert-component>
    <!-- Example on the non-premitive or complex data types -->
    <div class="slds-m-around_medium">
        <c-p2c-carousal-component carousal-details={carousalData}>

        </c-p2c-carousal-component>
    </div>
    <!-- Example of data passing on action -->

    <lightning-card title="Parent to Child action communication">
        <div class="slds-m-around_medium">
            <lightning-input type="number" label="Enter your Number" onkeyup={handlerChange}
                value={percentage}></lightning-input>
            <c-p2c-progress-component progress-value={percentage}></c-p2c-progress-component>
        </div>
    </lightning-card>
</template>
