<template>

    <lightning-card title="Handson SUBSCRIBER - Lightning Message Service">

        <div class="slds-m-around_medium">

            <!-- Clear Selection Button -->
            <lightning-button label="Clear Selection" variant="destructive" onclick={handlerClearSelection}>
            </lightning-button>

            <div class="slds-m-top_medium">

                <!-- Display received Accounts -->
                <template for:each={receivedMessage} for:item="acc">

                    <div key={acc.recordId} class="slds-m-bottom_small">

                        <p>
                            <strong>Account ID:</strong>
                            {acc.recordId}
                        </p>

                        <p>
                            <strong>Account Name:</strong>
                            {acc.recordName}
                        </p>

                    </div>

                </template>

                <!-- Displayed when no Accounts are selected -->
                <template if:false={receivedMessage.length}>

                    <p>
                        No Accounts selected.
                    </p>

                </template>

            </div>

        </div>

    </lightning-card>

</template>
